server.port=8082
spring.application.name=task-service

# MongoDB Connection (Container name will be 'mongo-db' from the shared network)
spring.mongodb.uri=mongodb://root:${MONGO_DB_PASSWORD}@task-mongodb:27017/pms_task_service?authSource=admin

# Placeholder for the secret (injected by Docker)
application.security.jwt.secret-key=${APPLICATION_SECURITY_JWT_SECRET_KEY}
