services:
  # --- Service 1: MySQL Database ---
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      # Explicitly map the shared DB_PASSWORD to the MySQL-specific variable
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: pms_user_service
    ports:
      - "3307:3306"
    volumes:
      - user-service-db-data:/var/lib/mysql
    networks:
      - pms-network
    env_file:
      - ../.env

  # --- Service 2: User Service (Your App) ---
  user-service:
    build: .
    container_name: user-service
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      # Database connection settings
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/pms_user_service
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQLDialect
      APPLICATION_SECURITY_JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    networks:
      - pms-network
    depends_on:
      - mysql-db
    # Load variables from the root .env file
    env_file:
      - ../.env

# --- Volumes ---
volumes:
  user-service-db-data:

# --- Networks ---
networks:
  pms-network:
    driver: bridge