server.port=8081
spring.application.name=team-service

# MongoDB URI is typically injected by Docker via SPRING_DATA_MONGODB_URI.
# Provide a local default for running without Docker.
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/pms_team_service}

# JWT secret (injected by Docker)
application.security.jwt.secret-key=${APPLICATION_SECURITY_JWT_SECRET_KEY}
