server {
    listen 80;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" always;

    # 1. Serve the React Frontend
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # Fix for React Router: redirect 404s to index.html so routes work
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy /api/v1/users -> User Service
    location /api/v1/auth {
        proxy_pass http://user-service:8080;
    }
    location /api/v1/admin {
        proxy_pass http://user-service:8080;
    }
    location /api/v1/users {
        proxy_pass http://user-service:8080;
    }

    # 3. Proxy /api/v1/teams -> Team Service
    location /api/v1/teams {
        proxy_pass http://team-service:8081;
    }

    # 4. Proxy /api/v1/tasks -> Task Service
    location /api/v1/tasks {
        proxy_pass http://task-service:8082;
    }
}